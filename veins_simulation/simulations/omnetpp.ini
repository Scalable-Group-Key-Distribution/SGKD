[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = debug
debug-on-errors = true
print-undisposed = true

network = gkd_vanet.simulations.GroupKeyScenario
sim-time-limit = 300s
repeat = 10
seed-set = ${repetition}
**.scalar-recording = true
**.vector-recording = false
**.statistic-recording = false

*.playgroundSizeX = 5500m
*.playgroundSizeY = 500m
*.playgroundSizeZ = 50m
# SUMO / Veins


*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
#*.manager.moduleType="gkd_vanet.modules.GroupKeyVehicleApp"
#*.manager.moduleName = "node"
*.manager.launchConfig = xmldoc("groupkey.launchd.xml")

# Dynamic SUMO vehicles
*.node[*].applType = "gkd_vanet.modules.GroupKeyVehicleApp"
*.node[*].appl.headerLength = 88 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

# TA
*.ta.keyUpdateInterval = 3s
*.ta.wiredDatarate = 100Mbps
*.ta.wiredDelay = 1ms

*.numRsu = 10
*.ta.numRsu = 10
# RSU locations. Match these coordinates to the SUMO map.
# Calculate longitudinal position: X_0 = RSU_Radius, X_i = X_0 + i * (2*R - Overlap)
# Spacing = 2 * 300m - 60m = 540m
*.rsu[*].mobility.x = 300+ (parentIndex() * 540)
*.rsu[*].mobility.y = 250   # Positioned along the road shoulder (200m Y-offset)
*.rsu[*].mobility.z = 3    # Pole height (3 meters)
#*.rsu[0].mobility.x = 250
#*.rsu[0].mobility.y = 250
#*.rsu[0].mobility.z = 3
#
#*.rsu[1].mobility.x = 1250
#*.rsu[1].mobility.y = 250
#*.rsu[1].mobility.z = 3
#
#*.rsu[2].mobility.x = 2250
#*.rsu[2].mobility.y = 250
#*.rsu[2].mobility.z = 3

*.rsu[*].appl.headerLength = 88 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].nic.phy80211p.antennaOffsetZ = 3m

# Wireless configuration
*.connectionManager.maxInterfDist = 350m
*.connectionManager.sendDirect = true

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")

# Statistics

*.node[*].appl.registrationLatency.result-recording-modes = +vector,+scalar
*.node[*].appl.keyUpdateVersion.result-recording-modes = +vector,+scalar
*.node[*].appl.updateLatency.result-recording-modes=+vector,+scalar
*.node[*].appl.updateLatencySignal.result-recording-modes=+vector,+scalar
*.ta.registrationRequests.result-recording-modes = +scalar
*.ta.registrationResponses.result-recording-modes = +scalar
*.ta.keyUpdates.result-recording-modes = +scalar

# GUI
*.manager.firstStepAt = 0s

[Config Route50KM100RSU]
sim-time-limit = 600s
*.playgroundSizeX = 50500m
*.playgroundSizeY = 500m
*.playgroundSizeZ = 50m
*.numRsu = 92
*.ta.numRsu = 92
*.manager.launchConfig = xmldoc("groupkey50km.launchd.xml")

